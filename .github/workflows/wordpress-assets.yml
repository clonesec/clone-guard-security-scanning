name: Update WordPress.org readme and assets

# Pushes readme.txt and .wordpress-org/ (banner, icons, screenshots) to SVN without a release.
# The action stops with an error if any other shipped file differs from SVN trunk, so a release
# must be deployed (GitHub release published) before its branch is merged into main. See docs/RELEASING.md.
on:
  push:
    branches: [main]
    paths:
      - 'readme.txt'
      - '.wordpress-org/**'

permissions:
  contents: read

concurrency:
  group: wordpress-assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: clone-guard-security-scanning
